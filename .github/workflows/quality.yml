name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage-server:
    name: coverage (Server, поріг 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Coverage
        shell: pwsh
        run: ./scripts/coverage.ps1 -Name Server

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-server-report
          path: |
            docs/reports/coverage-server.md
            coverage/server-report/**

  analyzers:
    name: analyzers (SonarAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Analyzer report
        shell: pwsh
        run: ./scripts/analyzer-report.ps1

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyzer-report
          path: docs/reports/analyzer-report.md
