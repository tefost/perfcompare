name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: coverage (${{ matrix.project }}, поріг 80%)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Server, Runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Coverage
        shell: pwsh
        run: ./scripts/coverage.ps1 -Name ${{ matrix.project }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.project }}-report
          path: |
            docs/reports/coverage-*.md
            coverage/*-report/**

  analyzers:
    name: analyzers (SonarAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Analyzer report
        shell: pwsh
        run: ./scripts/analyzer-report.ps1

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyzer-report
          path: docs/reports/analyzer-report.md
